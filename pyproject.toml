[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qhdalabs-cnvs"
version = "0.1.0"
description = "Cross-national information verification research scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.scripts]
cnvs = "cnvs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
